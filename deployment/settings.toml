unit = "minutes"
min = 0
max = 30
description = "How long one process reuses a TomTom reading for the same point, and how old a reading a run still applies (at least the response age above). 0 turns reuse off."

[cache.camera_cache_seconds]
value = 60
unit = "seconds"

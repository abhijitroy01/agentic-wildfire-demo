# FireGUard operational settings, shared by every installation (decisions D23 and D24).
#
# This file is the only place to set operational limits, budgets, rates, sizes, counts, TTLs,
# concurrency and task sizes. The AgentCore Runtime's per-turn safety bounds (tool-call budgets,
# reasoning deadlines, Memory read sizes, model output budgets) are protocol constants in
# backend/runtime code instead. There are no command-line options for them: edit a value here and run
# `bash deployment/deploy-all.sh --apply`. Every deploy applies exactly what this file says (plus the
# optional [settings] overrides in your deployment/installation.toml) and records the effective values
# in the release folder.
#
# Each setting is a small table:
#   value        the default, in the unit named by the key (TOML integer, float, string, boolean or list)
#   unit         the unit, also part of the key name
#   min, max     the allowed range for numbers, or
#   allowed      the allowed values for strings
#   description  one line
#
# Names: a key is unique across sections. Its CloudFormation parameter is the key in CamelCase
# (requests_per_ip_per_5_minutes -> RequestsPerIpPer5Minutes) and a container reads it as the upper-case
# environment variable (REQUESTS_PER_IP_PER_5_MINUTES). The settings table in
# architecture/29-workspace-operations.md is generated from this file:
#   .venv/bin/python -m deployment.installation          (rewrite the table)
#   .venv/bin/python -m deployment.installation --check  (fail on drift)
#
# Components read these values too: traffic-simulator/traffic_simulator/settings.py,
# backend/api_settings.py and firetruck-simulator/config/settings.py (the firetruck_*
# limits its service reads).
# Deployed tasks get each value they read as its environment
# variable (the WAF settings go straight into the WAF rules); local development and the tests use the value
# written here (tests override it through the variable).

# Daily budgets count every visitor together, per UTC day, in the jobs table (counters expire through TTL).
[budgets.tomtom_calls_per_day]
value = 1000
unit = "calls"
min = 0
max = 100000
description = "TomTom traffic requests all visitors may cause per UTC day (runs and source lookups; reused cached readings are free). Past it, runs continue with traffic speeds marked unavailable."

[budgets.agent_requests_per_day]
value = 500
unit = "requests"
min = 0
max = 100000
description = "AgentCore agent requests (Bedrock) all visitors may start per UTC day: agent turns, investigations, radio investigations and firetruck reports. Past it, 429 DAILY_LIMIT_REACHED."

[budgets.geocoding_requests_per_day]
value = 1000
unit = "requests"
min = 0
max = 100000
description = "Amazon Location address lookups (new incidents) all visitors may start per UTC day. Past it, 429 DAILY_LIMIT_REACHED."

# The optional Delphire camera ([camera] in the installation file) reaches visitors only through the workspace API.
# The default is a cap, not a sizing: size it when an installation turns the camera on.
[budgets.camera_calls_per_day]
value = 1000
unit = "calls"
min = 0
max = 100000
description = "Delphire camera calls (latest records, refreshes and images) all visitors may cause per UTC day; reused answers are free. Each API process fetches on its own, so steady demand costs up to 2 x 86400 / cache.camera_cache_seconds latest calls per API task per day (2,880 at 60 s) plus images. Past it, 429 DAILY_LIMIT_REACHED."

[capacity.active_jobs_all_visitors]
value = 5
unit = "jobs"
min = 1
max = 100
description = "Queued, running and cancelling simulation jobs (runs and road-network preparations) across all visitors. Past it, 503 SIMULATOR_BUSY with Retry-After."

[capacity.active_jobs_per_session]
value = 2
unit = "jobs"
min = 1
max = 10
description = "Queued, running and cancelling simulation jobs one demo session (or the local developer) may have at once. Past it, 429 ACTIVE_RUN_LIMIT."

[capacity.demo_session_days]
value = 7
unit = "days"
min = 1
max = 30
description = "Lifetime of a demo session cookie and of every record it creates (sessions, incidents, drafts, turns, jobs, receipts), which DynamoDB TTL then deletes."

[capacity.discoveries_per_api_process]
value = 8
unit = "discoveries"
min = 1
max = 64
description = "Legacy synchronous discovery process slots; new OSM discoveries use the SUMO worker queue and shared admission."

[capacity.investigations_per_api_process]
value = 4
unit = "investigations"
min = 1
max = 32
description = "Saved background investigations executing per API process (two processes per API task). Includes cancelled calls still returning; excess requests get 503 INVESTIGATION_BUSY before billing or starting a task."

[capacity.request_body_max_kib]
value = 160
unit = "KiB"
min = 64
max = 1024
description = "Largest API request body. A larger body gets 413 BODY_TOO_LARGE before any model or provider sees it."

[capacity.request_body_seconds]
value = 20
unit = "seconds"
min = 5
max = 120
description = "Time a client has to send an API request body. A slower body gets 408 REQUEST_TIMEOUT."

# The workspace API's camera broker (the optional [camera] section of the installation file).
[capacity.camera_image_max_kib]
value = 2048
unit = "KiB"
min = 64
max = 10240
description = "Largest camera image (WebP or PNG) the broker reads from Delphire and serves. A larger image gets 502 CAMERA_IMAGE_TOO_LARGE."

# Two calls (latest, then an image) must fit CloudFront's 60-second origin timeout, so the maximum is 25.
[capacity.camera_request_timeout_seconds]
value = 10
unit = "seconds"
min = 2
max = 25
description = "Longest one Delphire camera call may take, from connecting to its last byte. A slower call gets 503 CAMERA_UNAVAILABLE."

# ECS task sizes. Each <task>_vcpu and <task>_memory_gib pair must be a Fargate size, which the deployer checks before
# any AWS call: 1 vCPU takes 2-8 GiB, 2 vCPU 4-16 GiB, 4 vCPU 8-30 GiB, 8 vCPU 16-60 GiB in 4 GiB steps and
# 16 vCPU 32-120 GiB in 8 GiB steps. A changed size starts new tasks with a new task definition revision.
[capacity.api_vcpu]
value = 1
unit = "vCPU"
min = 1
max = 16
description = "vCPUs of the workspace API task (Fargate size with capacity.api_memory_gib)."

[capacity.api_memory_gib]
value = 4
unit = "GiB"
min = 2
max = 120
description = "Memory of the workspace API task."

[capacity.worker_vcpu]
value = 4
unit = "vCPU"
min = 1
max = 16
description = "vCPUs of the SUMO worker task (Fargate size with capacity.worker_memory_gib); each policy simulated at once uses one."

[capacity.worker_memory_gib]
value = 8
unit = "GiB"
min = 2
max = 120
description = "Memory of the SUMO worker task."

[capacity.worker_tasks]
value = 2
unit = "tasks"
min = 1
max = 5
description = "Independent SUMO worker tasks consuming the shared queue. Each runs one job at a time; two tasks allow two scenarios or road preparations to execute concurrently without sharing mutable SUMO state."

[capacity.firetruck_vcpu]
value = 1
unit = "vCPU"
min = 1
max = 16
description = "vCPUs of the private firetruck service task (Fargate size with capacity.firetruck_memory_gib)."

[capacity.firetruck_memory_gib]
value = 2
unit = "GiB"
min = 2
max = 120
description = "Memory of the private firetruck service task."

[capacity.radio_vcpu]
value = 1
unit = "vCPU"
min = 1
max = 16
description = "vCPUs of the private radio service task (Fargate size with capacity.radio_memory_gib)."

[capacity.radio_memory_gib]
value = 2
unit = "GiB"
min = 2
max = 120
description = "Memory of the private radio service task."

# The firetruck demonstration (Response Tracker). The private firetruck service reads the run lifetime, runs per task
# and evidence events; the workspace API's broker reads the run lifetime and the per-session limits.
# A finished run's final evidence keeps every event, and the broker reads at most 2 MiB of evidence (a two-hour run
# measured 1.27 MB), so the run lifetime can only be lowered from 120 minutes.
[capacity.firetruck_run_lifetime_minutes]
value = 120
unit = "minutes"
min = 10
max = 120
description = "Longest a firetruck run lasts before the service stops it and saves its final evidence; the broker also stops counting an older run as active."

[capacity.firetruck_runs_per_task]
value = 50
unit = "runs"
min = 1
max = 200
description = "Firetruck runs one private firetruck service task simulates at once. Past it, a new run gets 429 FIRETRUCK_UNAVAILABLE (retryable)."

# 500 matches the UI's 500-event history; a running snapshot of 5,000 events stays well under the broker's 2 MiB cap.
[capacity.firetruck_evidence_events_max]
value = 500
unit = "events"
min = 50
max = 5000
description = "Latest timeline events each running firetruck evidence snapshot carries; earlier events are counted, not stored, and a finished run's final snapshot keeps every event."

[capacity.firetruck_active_runs_per_session]
value = 2
unit = "runs"
min = 1
max = 10
description = "Firetruck runs one demo session (or the local developer) may have starting or running at once. Past it, 429 RUN_LIMIT until one stops or reaches its lifetime."

[capacity.firetruck_runs_per_session]
value = 100
unit = "runs"
min = 1
max = 200
description = "Firetruck runs one demo session may start in its lifetime. Past it, 429 RUN_LIMIT."

[capacity.firetruck_streams_per_session]
value = 4
unit = "streams"
min = 1
max = 20
description = "Live firetruck update streams (WebSockets) one demo session may have open at once. Past it, the new stream is closed with code 1008 (STREAM_LIMIT)."

[capacity.firetruck_stream_lifetime_minutes]
value = 15
unit = "minutes"
min = 1
max = 60
description = "Longest one live firetruck update stream stays open, never past its demo session; the stream then closes."

[rate_limits.demo_sessions_per_ip_per_day]
value = 20
unit = "sessions"
min = 1
max = 100000
description = "New demo sessions one viewer IP may start per UTC day; each session has its own job limits. Past it, 429 DEMO_SESSION_LIMIT."

[rate_limits.requests_per_ip_per_5_minutes]
value = 600
unit = "requests"
min = 100
max = 100000
description = "WAF rate rule on the API load balancer: requests one viewer IP may send in any 5-minute window before WAF blocks it."

# WAF accepts rate limits from 10. Visitors behind one shared address (an office or event network) share this limit.
[rate_limits.work_requests_per_ip_per_5_minutes]
value = 20
unit = "requests"
min = 10
max = 100000
description = "WAF rate rule for requests that start work (runs, variants, drafts, Traffic Lab runs and lookups, agent turns, radio streams, firetruck runs and reports): requests one viewer IP may send in any 5-minute window before WAF answers 429."

# A scenario has at most three policies. The deployer refuses a value above capacity.worker_vcpu.
[simulation.policy_parallelism]
value = 3
unit = "policies"
min = 1
max = 3
description = "Scenario policies one worker simulates at once, each in its own process with its own SUMO; 1 runs them one after another. Results are identical either way."

# The published simulation contract allows at most 15 km, so this setting can only lower the limit.
[simulation.max_study_radius_km]
value = 15.0
unit = "km"
min = 2.0
max = 15.0
description = "Largest study-area radius a visitor may simulate, discover or look up sources for. A larger radius gets 422 RADIUS_TOO_LARGE."

# The published simulation contract allows at most 14,000 edges (network_validation.edge_count), so this setting can
# only lower the limit.
[simulation.max_network_edges]
value = 14000
unit = "edges"
min = 1000
max = 14000
description = "Largest road network a run or road-network preparation accepts, counted as SUMO edges open to cars and longer than 15 m. A larger network fails a run; a preparation tries a smaller extent."

[simulation.overpass_response_max_mb]
value = 50
unit = "MB"
min = 1
max = 100
description = "Largest OpenStreetMap road download from Overpass, in megabytes of 1,000,000 bytes. The download stops there and counts as a network that is too large."

# One page holds at most 200 highway features, and a whole study area's geometry is usually under 1 MB.
[simulation.caltrans_response_max_mb]
value = 20
unit = "MB"
min = 1
max = 100
description = "Largest Caltrans highway-service response one highway discovery request reads, in megabytes of 1,000,000 bytes. A larger response stops the discovery with a size error."

[simulation.tomtom_requests_per_run]
value = 12
unit = "requests"
min = 1
max = 50
description = "TomTom flow readings one traffic-speed run captures, at sample points at least 1 km apart on the study area's highways."

# TomTom answers requests past a plan's queries-per-second limit with 429, which stops a traffic-speed run, so keep
# this within the plan's limit.
[simulation.tomtom_request_concurrency]
value = 4
unit = "requests"
min = 1
max = 12
description = "TomTom flow requests one traffic-speed run sends at once; 1 sends them one after another. Each still spends the daily budget first, in sample-point order, and the saved traffic snapshot is the same either way."

[simulation.tomtom_response_max_age_seconds]
value = 300
unit = "seconds"
min = 60
max = 900
description = "Oldest provider response date accepted when a TomTom reading is fetched; an older or future-dated response is rejected."


, "type": "object"}
    Evacuation_ErrorDetails: {"additionalProperties": false, "properties": {"code": {"title": "Code", "type": "string"}, "details": {"additionalProperties": {"$ref": "#/components/schemas/Evacuation_JsonValue"}, "title": "Details", "type": "object"}, "message": {"title": "Message", "type": "string"}, "request_id": {"anyOf": [{"format": "uuid", "type": "string"}, {"type": "null"}], "default": null, "title": "Request Id"}, "retryable": {"default": false, "title": "Retryable", "type": "boolean"}}, "required": ["code", "message"], "title": "ErrorDetails", "type": "object"}

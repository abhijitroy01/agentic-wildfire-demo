openapi: 3.0.0
info:
  title: Wildfire Management System API
  version: 1.0.0
  description: API schema for wildfire detection, response, and communication

components:
  schemas:
    # Main Response Structure
    UniversalResponse:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          enum: [structuredResponse]
          description: Response type identifier
        content:
          $ref: "#/components/schemas/UniversalContent"

    UniversalContent:
      type: object
      required: [response]
      properties:
        fireExposureError:
          description: Safe terrain preparation handoff failure attached only by the authenticated API broker.
          $ref: "#/components/schemas/FireExposure_FireRiskPreparationError"
        fireExposureJobs:
          type: array
          default: []
          description: Owned durable landscape preparation jobs attached only by the authenticated API broker.
          items:
            $ref: "#/components/schemas/FireExposure_FireRiskJobReference"
        fireExposureData:
          type: array
          default: []
          description: Source-bound fire exposure assessments attached by the authenticated API broker.
          items:
            $ref: "#/components/schemas/FireExposure_AssessmentResult"
        simulationData:
          $ref: "#/components/schemas/Evacuation_SimulationOutput"
          nullable: true
        location:
          $ref: "#/components/schemas/Location"
        response:
          type: string
          description: Text response from the agent
        sourceAvailability:
          type: object
          nullable: true
          description: Validated source outcomes for each requested detection topic, independent of prose
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [available, unavailable]
              code:
                type: string
                nullable: true
        mapData:
          $ref: "#/components/schemas/MapData"
        audioData:
          $ref: "#/components/schemas/AudioData"
        forecastData:
          $ref: "#/components/schemas/MultiDayForecast"
          nullable: true
          description: Multi-day weather forecast data grouped by date
        knowledgeBaseCitations:
          type: array
          nullable: true
          description: Citations from knowledge base sources
          items:
            $ref: "#/components/schemas/KnowledgeBaseCitation"
        imageData:
          $ref: "#/components/schemas/ImageData"
          nullable: true
          description: Generated report image with thumbnail for inline display

    # Child Agent Output Schemas (for structured output)
    DetectionOutput:
      type: object
      required: [query_type, response_text]
      properties:
        query_type:
          type: string
          enum: [current, forecast, combined]
          description: Type of detection query performed
        response_text:
          type: string
          description: Qualitative briefing for the requested observations; source measurements remain in mapData and forecastData
        location:
          $ref: "#/components/schemas/Location"
        mapData:
          $ref: "#/components/schemas/MapData"
        forecastData:
          $ref: "#/components/schemas/MultiDayForecast"
          nullable: true

    ResponseOutput:
      type: object
      required: [query_type, response_text]
      properties:
        query_type:
          type: string
          enum: [response]
          description: Type of response query
        response_text:
          type: string
          description: Generated response text
        knowledgeBaseCitations:
          type: array
          nullable: true
          description: Citations from knowledge base
          items:
            $ref: "#/components/schemas/KnowledgeBaseCitation"

    CommunicationOutput:
      type: object
      required: [query_type, response_text]
      properties:
        query_type:
          type: string
          enum: [communication]
          description: Type of communication query
        location:
          $ref: "#/components/schemas/Location"
        response_text:
          type: string
          description: Summary response text
        audioData:
          $ref: "#/components/schemas/AudioData"
          nullable: true

    # Report Agent Output Schema (for structured output enforcement)
    ReportOutput:
      type: object
      required: [query_type, htmlUrl, reportId]
      description: Output schema for Report Agent - enforces structured output to prevent URL hallucination
      properties:
        query_type:
          type: string
          enum: [report]
          description: Type of report query
        htmlUrl:
          type: string
          format: uri
          description: Presigned S3 URL for HTML report (24-hour expiration)
        reportId:
          type: string
          description: Unique report identifier (e.g., RPT-20251226-093145)
        title:
          type: string
          description: Report title
        summary:
          type: string
          description: Brief text summary of the report content
        s3Bucket:
          type: string
          description: S3 bucket name where report is stored
        s3Key:
          type: string
          description: S3 key for the HTML report file
        generatedAt:
          type: string
          format: date-time
          description: When the report was generated
        expiresAt:
          type: string
          format: date-time
          description: When the presigned URL expires

    # Location Structure
    Location:
      type: object
      properties:
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
        name:
          type: string

    # Map Data Structures
    MapData:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/MapSummary"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/FireLocation"

    MapSummary:
      type: object
      properties:
        location:
          $ref: "#/components/schemas/Location"
        name:
          type: string
        totalActiveFires:
          type: integer
          minimum: 0
        processedLocationsWithWeather:
          type: integer
          minimum: 0
        searchArea:
          type: string
        dataRecency:
          type: string
        analysisTimestamp:
          type: string
          format: date-time

    FireLocation:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        fire:
          $ref: "#/components/schemas/FireData"
        currentWeather:
          $ref: "#/components/schemas/WeatherData"

    FireData:
      type: object
      properties:
        sourceId:
          type: string
          nullable: true
          description: Stable identifier of the observed Esri incident, including the identifier field.
        name:
          type: string
          description: Name of the wildfire incident
        acresBurned:
          type: number
          format: float
          minimum: 0
          nullable: true
          description: Current acres burned (from DailyAcres or CalculatedAcres)
        percentContained:
          type: number
          format: float
          minimum: 0
          maximum: 100
          nullable: true
          description: Percentage of fire contained (0-100)
        county:
          type: string
          nullable: true
          description: Point of Origin County
        state:
          type: string
          nullable: true
          description: Point of Origin State (e.g., US-CA, US-WA)
        location:
          type: string
          nullable: true
          description: Location description constructed from county/state
        startedDate:
          type: string
          format: date-time
          nullable: true
          description: Fire discovery date and time
        lastUpdated:
          type: string
          format: date-time
          nullable: true
          description: Last modification date and time
        isActive:
          type: boolean
          description: Whether fire is currently active (derived from IncidentTypeCategory)
        distanceMiles:
          type: number
          format: float
          description: Distance from search center in miles
        priorityScore:
          type: number
          format: float
          description: Calculated priority score (0-1)
        rank:
          type: integer
          description: Priority ranking
        fireCause:
          type: string
          nullable: true
          description: Cause of the fire (Human, Natural, Lightning, Unknown, etc.)
        personnel:
          type: integer
          nullable: true
          minimum: 0
          description: Total number of incident personnel assigned
        residencesDestroyed:
          type: integer
          nullable: true
          minimum: 0
          description: Number of residences destroyed
        structuresDestroyed:
          type: integer
          nullable: true
          minimum: 0
          description: Number of other structures destroyed
        injuries:
          type: integer
          nullable: true
          minimum: 0
          description: Number of injuries
        fatalities:
          type: integer
          nullable: true
          minimum: 0
          description: Number of fatalities
        complexity:
          type: string
          nullable: true
          description: Fire management complexity level (Type 1-5)

    # Weather Data Structures (Cleaned - Critical Fields Only)
    WeatherData:
      type: object
      properties:
        queryLocation:
          $ref: "#/components/schemas/Location"
          description: Coordinate submitted to DTN for this observation; retained with source evidence.
        timestamp:
          type: string
          format: date-time
        temperature:
          $ref: "#/components/schemas/WeatherValue"
        dewpoint:
          $ref: "#/components/schemas/WeatherValue"
        heatIndex:
          $ref: "#/components/schemas/WeatherValue"
        relativeHumidity:
          $ref: "#/components/schemas/WeatherValue"
        wind:
          $ref: "#/components/schemas/WindData"
        precipitation:
          $ref: "#/components/schemas/PrecipitationData"
        weatherDescription:
          type: string
          description: Human-readable weather condition (e.g., 'Clear sky', 'Thunderstorm')
        dtnSpecific:
          type: object
          properties:
            hotDryWindyIndex:
              $ref: "#/components/schemas/WeatherValue"

    WeatherValue:
      type: object
      properties:
        value:
          type: number
          format: float
          nullable: true
        unit:
          type: string
          nullable: true

    WindData:
      type: object
      properties:
        speed:
          $ref: "#/components/schemas/WeatherValue"
        direction:
          $ref: "#/components/schemas/WeatherValue"
        gust:
          $ref: "#/components/schemas/WeatherValue"

    PrecipitationData:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/WeatherValue"
        probability:
          $ref: "#/components/schemas/WeatherValue"

    # Forecast Data Structures
    ForecastData:
      type: object
      properties:
        provider:
          type: string
        periods:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPeriod"

    ForecastPeriod:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        temperature:
          $ref: "#/components/schemas/WeatherValue"
        dewpoint:
          $ref: "#/components/schemas/WeatherValue"
        heatIndex:
          $ref: "#/components/schemas/WeatherValue"
        relativeHumidity:
          $ref: "#/components/schemas/WeatherValue"
        wind:
          $ref: "#/components/schemas/WindData"
        precipitation:
          $ref: "#/components/schemas/PrecipitationData"
        hotDryWindyIndex:
          $ref: "#/components/schemas/WeatherValue"

    # Multi-Day Forecast Structures
    MultiDayForecast:
      type: object
      properties:
        provider:
          type: string
          example: "DTN"
          description: Weather data provider
        totalDays:
          type: integer
          minimum: 1
          description: Total number of days in forecast
        days:
          type: array
          items:
            $ref: "#/components/schemas/ForecastDay"
          description: Forecast data grouped by day

    ForecastDay:
      type: object
      properties:
        date:
          type: string
          description: Date for this forecast day (YYYY-MM-DD format)
        dayName:
          type: string
          description: Day of week name
        periods:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPeriod"
          description: Forecast periods (typically 6-hour intervals)
        summary:
          $ref: "#/components/schemas/DailySummary"
          description: Daily weather summary and extremes

    DailySummary:
      type: object
      properties:
        highTemp:
          $ref: "#/components/schemas/WeatherValue"
          description: Highest temperature for the day
        lowTemp:
          $ref: "#/components/schemas/WeatherValue"
          description: Lowest temperature for the day
        maxWindSpeed:
          $ref: "#/components/schemas/WeatherValue"
          description: Maximum wind speed for the day
        avgHumidity:
          type: number
          description: Average relative humidity percentage
        precipProb:
          type: number
          description: Maximum precipitation probability
        maxHDWIndex:
          type: number
          description: Maximum Hot-Dry-Windy index (fire risk indicator)

    # Audio Data Structures
    AudioData:
      type: object
      nullable: true
      properties:
        success:
          type: boolean
          description: Overall success status of audio generation
        messageId:
          type: string
          description: Unique identifier for the message
        generatedAt:
          type: string
          format: date-time
          description: ISO timestamp when audio was generated
        expiresAt:
          type: string
          format: date-time
          description: ISO timestamp when audio URLs expire
        languages:
          type: object
          description: Audio data for each language
          additionalProperties:
            $ref: "#/components/schemas/AudioLanguage"
        summary:
          $ref: "#/components/schemas/AudioSummary"

    AudioLanguage:
      type: object
      properties:
        success:
          type: boolean
          description: Success status for this language
        languageName:
          type: string
          description: Human-readable language name
        voice:
          type: string
          description: AWS Polly voice used for synthesis
        translatedText:
          type: string
          description: Translated message text
        audioUrl:
          type: string
          format: uri
          description: Presigned S3 URL for audio file
        s3Key:
          type: string
          description: S3 object key for audio file
        expires:
          type: integer
          format: int64
          description: Unix timestamp when URL expires
        isExpired:
          type: boolean
          description: Whether the URL has expired

    AudioSummary:
      type: object
      properties:
        totalLanguages:
          type: integer
          description: Total number of languages requested
          minimum: 0
        successful:
          type: integer
          description: Number of successfully generated audio files
          minimum: 0
        failed:
          type: integer
          description: Number of failed audio generation attempts
          minimum: 0

    # Image Data Structures (Report Generation)
    ImageData:
      type: object
      nullable: true
      description: Generated HTML report data for display in UI
      properties:
        success:
          type: boolean
          description: Whether report generation succeeded
        reportId:
          type: string
          description: Unique report identifier
          example: "RPT-20251226-093145"
        title:
          type: string
          description: Report title
          example: "Fire Comparison Report"
        summary:
          type: string
          description: Brief text summary of the report content
        htmlUrl:
          type: string
          format: uri
          description: Presigned S3 URL for HTML report (24-hour expiration)
        s3Bucket:
          type: string
          description: S3 bucket name
        s3Key:
          type: string
          description: S3 key for HTML report file
          example: "reports/session_abc123/RPT-20251226-093145.html"
        generatedAt:
          type: string
          format: date-time
          description: When the report was generated
        expiresAt:
          type: string
          format: date-time
          description: When presigned URL expires
        error:
          type: string
          nullable: true
          description: Error message if generation failed

    # Knowledge Base Citation Structures
    KnowledgeBaseCitation:
      type: object
      properties:
        documentName:
          type: string
          description: Reviewed source title (or filename for legacy private documents)
        excerpt:
          type: string
          description: Verbatim retrieved excerpt, up to 500 characters
        sourceUrl:
          type: string
          description: Official HTTPS publication URL from reviewed source metadata
        publisher:
          type: string
          description: Publishing government agency
        sourceDate:
          type: string
          description: Publication date or source's stated last update; absent if not stated
        retrievedAt:
          type: string
          description: Date this source snapshot was retrieved and reviewed

